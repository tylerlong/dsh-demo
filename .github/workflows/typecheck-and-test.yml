name: typecheck-and-test

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    # Dependencies resolve from the PUBLIC npm registry (the @deepseek-ai
    # packages are published there), so a GitHub-hosted runner with internet
    # access works. No COREPACK_NPM_REGISTRY override here: that env var is
    # only needed on machines whose network blocks the public registry (e.g.
    # the corporate intranet), and CI must NOT point at an intranet-only
    # Nexus endpoint.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

      # Read-only lint gate: `lint:check` never writes, so CI cannot mask
      # fixable findings by auto-fixing them.
      - run: pnpm lint:check

      - run: pnpm test
