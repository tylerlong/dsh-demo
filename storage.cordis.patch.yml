# harness-workflow storage stack: the shared workspace registry.
#
# Mirrors the web-app bundle's storage rows (packages/bundle/web-app/
# cordis.patch.yml) so `ctx.workspaceRegistry` composes and reads the SAME
# workspace table as DSH web ($DSH_HOME/storages/workspace.json). The base
# bundle does not ship storage/workspace, so this overlay mounts them here.
#
# harness-workflow is read-only over the registry — it never calls create, delete,
# insertBefore, or archiveSession; DSH web owns the catalog.
- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Projection cache over session_projcache.json: DSH web's store face for
    # per-session title / sessionListMetadata reads. Mounted read-only —
    # cachedSnapshot(meta) is a synchronous in-memory look-up, and the
    # write-behind listeners only fire for live sessions (none in this
    # read-only process). Mirrors the web-app bundle row.
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
